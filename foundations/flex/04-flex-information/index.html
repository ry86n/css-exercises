<!-- POST EXERCISE NOTES FOR IMPROVEMENTS

Mistakes found: 
- Utilized redundant text-align prop. in both items and title rather than applying to body. 
- Created 4 distinct classes and then used a grouping selector within CSS vs the proper 
method of applying a single common class selector across html elements that can share the rules within the class. Remember classes are used to be reapplied through HTML to similarily styled elements, not applied as an ID or unique value to only be used once. 
- Flex: auto /value pair created for the container not needed. 

Insights: 
By going lower in specficity you can often kill two birds with one stone. Applying a rule lower if needed can reduce redundant/inefficient code. 

-->
